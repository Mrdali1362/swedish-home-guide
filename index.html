<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <title>Podterm — podcast player</title>

  <!-- PWA / iOS home-screen app -->
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Podterm">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* shadcn zinc dark theme — background/foreground convention */
      --bg:       #09090b;             /* zinc-950 — app shell background */
      --bg2:      #18181b;             /* zinc-900 — card / player bar surface */
      --bg3:      #27272a;             /* zinc-800 — inputs, thumbnails, subtle fills */
      /* Neutral primary accent (shadcn default has no hue — emphasis comes from */
      /* near-white vs. muted gray, not color) */
      --accent:    #fafafa;            /* primary foreground — highlighted text/icons, ~18:1 on bg */
      --accent2:   #a1a1aa;            /* secondary meta emphasis (episode date) — zinc-400 */
      --accent-fill: #fafafa;          /* primary fill for progress/graphics (non-text) */
      --gd:       rgba(255,255,255,0.4);
      --gf:       rgba(255,255,255,0.06);
      --border:   rgba(255,255,255,0.1);   /* shadcn --border in dark mode */
      --borderB:  #71717a;             /* zinc-500 — interactive/focus boundary */
      --text:     #fafafa;             /* zinc-50  — primary text,   ~18:1 on bg3 */
      --dim:      #a1a1aa;             /* zinc-400 — secondary text, ~7.5:1 on bg3 */
      --dimmer:   #71717a;             /* zinc-500 — tertiary text,  ~4.6:1 on bg3 */
      --error:    #f87171;             /* red-400 — destructive, ~6.8:1 on bg3 */
      --font:     'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --radius:   0.625rem;            /* shadcn default radius */
      --radius-sm: calc(var(--radius) - 4px);
      --radius-lg: calc(var(--radius) + 2px);
      --ph: 86px;
    }

    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }

    /* Visible keyboard-focus indicator (accent is ~8:1 on bg) */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── APP GRID ─── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr var(--ph);
      height: 100vh;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    .hdr {
      display: flex; align-items: center; gap: 18px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: relative; z-index: 200;
    }
    /* Feather icons */
    .fi { display: block; flex-shrink: 0; }
    [hidden] { display: none !important; }

    /* Skip link (WCAG 2.4.1) */
    .skip-link {
      position: absolute; left: 8px; top: -60px; z-index: 1000;
      background: var(--bg3); color: var(--accent); border: 1px solid var(--borderB); border-radius: var(--radius);
      padding: 10px 14px; font-size: 12px; text-decoration: none;
      transition: top 0.15s;
    }
    .skip-link:focus { top: 8px; }

    /* Visually-hidden but available to assistive tech */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .hdr-search { flex: 1; max-width: none; display: flex; gap: 8px; }
    .search-inp {
      flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0 14px; height: 44px; font-family: var(--font); font-size: 13px; color: var(--text);
      outline: none; transition: border-color 0.15s; -webkit-appearance: none; appearance: none;
    }
    .search-inp::placeholder { color: var(--dimmer); }
    .search-inp:focus { border-color: var(--borderB); }
    .search-exec {
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--accent); cursor: pointer; transition: all 0.15s;
      min-width: 44px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .search-exec:hover { background: var(--gf); border-color: var(--borderB); }
    .search-exec:disabled { opacity: 0.4; cursor: not-allowed; }

    .hdr-status {
      font-size: 9px; color: var(--dimmer);
      flex-shrink: 0; margin-left: auto; white-space: nowrap;
    }
    .hdr-status .hi { color: var(--accent); }

    /* ─── SEARCH OVERLAY ─── */
    .s-overlay {
      position: fixed; top: 64px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
      z-index: 500; max-height: 400px; overflow-y: auto; overflow-x: hidden; display: none;
    }
    .s-overlay.open { display: block; }
    .s-overlay::-webkit-scrollbar { width: 2px; }
    .s-overlay::-webkit-scrollbar-thumb { background: var(--border); }

    .sr-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      cursor: default;
    }
    .sr-item:hover { background: var(--gf); }
    .sr-art { width: 34px; height: 34px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); object-fit: cover; }
    .sr-ph { width: 34px; height: 34px; flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--dim); }
    .sr-info { flex: 1; min-width: 0; }
    .sr-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-author { font-size: 10px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-add {
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--accent);
      font-family: var(--font); font-size: 11px; padding: 0 12px;
      min-height: 44px; min-width: 64px; display: inline-flex; align-items: center; gap: 5px;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s;
    }
    .sr-add:hover { background: var(--gf); border-color: var(--borderB); }
    .sr-add.added { border-color: var(--dimmer); color: var(--dimmer); cursor: default; }
    .sr-add:disabled { opacity: 0.5; cursor: not-allowed; }
    .sr-footer { padding: 0 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); min-height: 44px; }
    .sr-footer-meta { font-size: 10px; color: var(--dimmer); }
    .sr-close { background: transparent; border: none; color: var(--dim); font-family: var(--font); font-size: 11px; cursor: pointer; min-height: 44px; padding: 0 8px; }
    .sr-close:hover { color: var(--text); }
    .sr-no-results { padding: 14px 16px; font-size: 11px; color: var(--dim); }

    /* ─── MAIN ─── */
    .main {
      display: grid; grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    /* ─── SIDEBAR ─── */
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sb-head {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .sb-label { font-size: 9px; font-weight: 600; color: var(--accent); }
    .pod-list { flex: 1; overflow-y: auto; }
    .pod-list::-webkit-scrollbar { width: 2px; }
    .pod-list::-webkit-scrollbar-thumb { background: var(--border); }

    /* Library as a 3-column grid of show tiles */
    .pod-list.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; align-content: start; }
    .p-item { position: relative; min-width: 0; }
    .p-open {
      width: 100%; display: flex; flex-direction: column; gap: 7px;
      background: transparent; border: none; padding: 0; cursor: pointer;
      font-family: var(--font); color: inherit; text-align: left;
    }
    .p-cover {
      position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center; color: var(--dim);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .p-open:hover .p-cover { border-color: var(--borderB); }
    .p-item.active .p-cover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .p-thumb { width: 100%; height: 100%; object-fit: cover; }
    .p-name {
      font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .p-item.active .p-name { color: var(--accent); }

    .sb-empty { padding: 28px 14px; text-align: center; color: var(--dimmer); font-size: 10px; line-height: 2; }

    /* ─── CONTENT ─── */
    .content { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

    .c-head {
      padding: 11px 20px;
      display: flex; align-items: center; gap: 14px; flex-shrink: 0; background: var(--bg);
    }
    .c-art { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); object-fit: cover; }
    .c-art-ph { width: 44px; height: 44px; flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--dim); }
    .c-meta { flex: 1; min-width: 0; }
    .c-title { font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-author { font-size: 10px; color: var(--dim); margin-top: 2px; }
    .c-count { font-size: 9px; color: var(--dimmer); margin-top: 3px; }
    .c-del {
      margin-left: auto; flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: var(--radius);
      display: inline-flex; align-items: center; gap: 7px;
      background: transparent; border: 1px solid var(--error); color: var(--error);
      font-family: var(--font); font-size: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .c-del:hover { background: rgba(248,113,113,0.12); }

    .ep-list { flex: 1; overflow-y: auto; }
    .ep-list::-webkit-scrollbar { width: 2px; }
    .ep-list::-webkit-scrollbar-thumb { background: var(--border); }

    .ep-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 9px 20px; min-height: 56px;
      border: 0; border-left: 2px solid transparent; text-align: left;
      -webkit-appearance: none; appearance: none;
      background: transparent; font-family: var(--font); color: inherit;
      cursor: pointer; transition: background 0.1s;
    }
    .ep-item:hover { background: var(--gf); }
    .ep-item.playing { background: rgba(255,255,255,0.06); border-left-color: var(--accent); }
    .ep-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ep-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-item.playing .ep-title { color: var(--accent); }
    .ep-meta { font-size: 10px; color: var(--dimmer); margin-top: 4px; }
    .ep-date { color: var(--accent2); }
    .ep-sep { color: var(--dimmer); margin: 0 5px; }
    .ep-ico {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--radius-sm);
      border: 1px solid var(--border); color: var(--accent);
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .ep-item:hover .ep-ico { background: var(--gf); border-color: var(--borderB); }

    .c-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--dimmer);
    }
    .c-empty-icon {
      width: 56px; height: 56px; border-radius: 50%; margin-bottom: 18px;
      background: var(--bg3); color: var(--dim);
      display: flex; align-items: center; justify-content: center;
    }
    .c-msg { text-align: center; max-width: 260px; }
    .c-msg-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .c-msg-body { font-size: 12px; color: var(--dimmer); line-height: 1.6; }

    .loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px; color: var(--dim); font-size: 11px; }
    .err-row { padding: 20px; text-align: center; font-size: 10px; color: var(--error); line-height: 1.8; }

    /* ─── PLAYER ─── */
    .player {
      border-top: 1px solid var(--border); background: var(--bg2);
      display: flex; align-items: center; gap: 16px; padding: 0 20px;
      overflow: hidden;
    }
    .pl-art { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; }
    .pl-ph { width: 44px; height: 44px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--dim); flex-shrink: 0; }
    .pl-info { min-width: 0; width: 160px; flex-shrink: 0; }
    .pl-ep { font-size: 11px; font-weight: 500; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-pod { font-size: 10px; color: var(--dimmer); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-idle { font-size: 11px; color: var(--dim); }

    .pl-ctrls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .c-btn {
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius); color: var(--dim);
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0; position: relative;
    }
    .c-btn:hover:not(:disabled) { border-color: var(--borderB); color: var(--accent); background: var(--gf); }
    .c-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .c-btn.big {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: var(--accent-fill); color: var(--bg);
    }
    .c-btn.big:hover:not(:disabled) { background: var(--accent-fill); opacity: 0.85; }
    .c-btn.big:disabled { background: var(--bg3); color: var(--dimmer); opacity: 1; }
    .c-btn.skip { width: auto; min-width: 60px; padding: 0 10px; gap: 4px; }
    .c-btn.skip .skip-num { font-size: 12px; font-weight: 600; font-family: var(--font); }

    .pl-prog { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .pl-t { font-size: 10px; color: var(--dimmer); flex-shrink: 0; min-width: 36px; font-variant-numeric: tabular-nums; }
    .pl-t.r { text-align: right; }
    /* Sliders: 44px tall hit area, thin visible pill rail centered */
    .prog-track, .vol-track {
      position: relative; height: 44px; cursor: pointer; display: flex; align-items: center; flex-shrink: 0;
      touch-action: pan-x;   /* let vertical gestures (iOS home swipe) pass through */
    }
    .prog-track { flex: 1; min-width: 0; }
    .vol-track { width: 64px; }
    .prog-rail, .vol-rail {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      height: 4px; background: var(--border); border-radius: 999px;
    }
    .prog-fill, .vol-fill {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      height: 4px; border-radius: 999px; pointer-events: none;
    }
    .prog-fill { background: var(--accent-fill); width: 0%; transition: width 0.08s linear; }
    .vol-fill  { background: var(--accent-fill); width: 80%; }

    .pl-vol { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .vol-icon {
      width: 44px; height: 44px; flex-shrink: 0;
      background: transparent; border: none; color: var(--dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: color 0.15s;
    }
    .vol-icon:hover { color: var(--accent); }

    .pl-speed {
      font-size: 11px; color: var(--dim); background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
      min-width: 48px; height: 44px; padding: 0 8px; cursor: pointer;
      flex-shrink: 0; transition: all 0.15s; font-family: var(--font);
    }
    .pl-speed:hover { color: var(--accent); border-color: var(--borderB); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: calc(var(--ph) + 14px); left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
      padding: 8px 16px; font-size: 12px; font-weight: 500;
      opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 999; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─── MISC ─── */
    .spin { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 2px; height: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); }

    /* ─── MOBILE / iPHONE ─── */
    .c-back { display: none; }
    @media (max-width: 760px) {
      html, body { height: 100%; }
      .app { grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 100vh; height: 100dvh; }

      /* Header */
      .hdr { gap: 9px; padding: 0 12px; padding-top: env(safe-area-inset-top); min-height: 56px; min-width: 0; overflow: hidden; }
      .hdr-status { display: none; }
      .hdr-search { max-width: none; min-width: 0; }
      .search-inp { font-size: 13px; min-width: 0; } /* match .ep-title; viewport maximum-scale prevents iOS zoom */

      /* Search overlay full-width */
      .s-overlay { left: 0 !important; width: 100vw !important; max-height: 70vh; }

      /* Single-column: library OR episodes */
      .main { grid-template-columns: 1fr; }
      .sidebar { display: flex; border-right: none; }
      .content { display: none; }
      .app.view-eps .sidebar { display: none; }
      .app.view-eps .content { display: flex; }

      .ep-item { padding: 9px 14px; }

      /* Back button (chevron) in episode header — 44px target */
      .c-head { padding: 8px 12px; gap: 10px; }
      .c-back {
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 44px; height: 44px; border-radius: var(--radius);
        background: transparent; border: 1px solid var(--border); color: var(--accent);
        cursor: pointer;
      }
      .c-art, .c-art-ph { width: 40px; height: 40px; }

      /* Player: 3 rows — [art|info|speed] / progress / controls */
      .player {
        flex-wrap: wrap; height: auto; gap: 8px 10px;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
        align-content: center;
      }
      .pl-vol { display: none; }
      .pl-art, .pl-ph { order: 1; }
      .pl-info { order: 2; flex: 1; width: auto; min-width: 0; }
      .pl-speed { order: 3; }
      .pl-prog { order: 4; flex-basis: 100%; }
      .pl-ctrls { order: 5; flex-basis: 100%; justify-content: center; gap: 12px; }

      .toast { bottom: auto; top: calc(env(safe-area-inset-top) + 64px); }
    }

    /* Respect reduced-motion preference (WCAG 2.3.3) */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div class="app">

  <!-- HEADER -->
  <header class="hdr">
    <h1 class="sr-only">Podterm — podcast player</h1>
    <div class="hdr-search" role="search">
      <input id="search-inp" class="search-inp" type="search" autocomplete="off"
             aria-label="Search podcasts by name" placeholder="Search podcasts by name…" />
      <button class="search-exec" id="search-btn" type="button" aria-label="Search">
        <svg class="fi" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
  </header>

  <!-- SEARCH RESULTS OVERLAY (positioned by JS) -->
  <div class="s-overlay" id="s-overlay"></div>

  <!-- MAIN -->
  <div class="main">

    <!-- SIDEBAR / LIBRARY -->
    <aside class="sidebar" aria-label="Library">
      <div class="pod-list" id="pod-list"></div>
    </aside>

    <!-- EPISODE PANEL -->
    <main class="content" id="main"></main>

  </div>

  <!-- PLAYER BAR -->
  <div class="player" role="region" aria-label="Audio player">
    <div class="pl-ph" id="pl-art" aria-hidden="true" hidden></div>
    <div class="pl-info">
      <div class="pl-idle" id="pl-title" aria-live="polite">No episode loaded</div>
      <div class="pl-pod" id="pl-pod"></div>
    </div>
    <div class="pl-ctrls">
      <button class="c-btn" id="btn-prev" type="button" aria-label="Previous episode" disabled></button>
      <button class="c-btn skip" id="btn-back" type="button" aria-label="Rewind 15 seconds" disabled></button>
      <button class="c-btn big" id="btn-play" type="button" aria-label="Play" disabled></button>

           aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">

  </div>

</div>

<script>
// ================================================================
//  STATE
// ================================================================
let library  = [];
let epCache  = {};      // { podId: [episode] }
let selId    = null;    // podcast currently shown in content panel
let playId   = null;    // podcast of currently playing episode
let playIdx  = null;    // episode index currently playing
let speedIdx = 0;
const SPEEDS = [1, 1.25, 1.5, 2];
const EPISODE_LIMIT = 5;   // keep only the latest N episodes per podcast
let vol      = 0.8;
let muted    = false;
let toastTmr = null;

// ================================================================
//  DOM
// ================================================================
const searchInp  = document.getElementById('search-inp');
const searchBtn  = document.getElementById('search-btn');
const sOverlay   = document.getElementById('s-overlay');
const podList    = document.getElementById('pod-list');
const contentEl  = document.getElementById('main');
const toastEl    = document.getElementById('toast');
const aud        = document.getElementById('aud');
const btnPlay    = document.getElementById('btn-play');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const btnBack    = document.getElementById('btn-back');
const btnFwd     = document.getElementById('btn-fwd');
const progTrack  = document.getElementById('prog-track');
const progFill   = document.getElementById('prog-fill');
const volTrack   = document.getElementById('vol-track');
const volFill    = document.getElementById('vol-fill');
const plCur      = document.getElementById('pl-cur');
const plDur      = document.getElementById('pl-dur');
const plTitle    = document.getElementById('pl-title');
const plPod      = document.getElementById('pl-pod');
const plArtEl    = document.getElementById('pl-art');
const plSpeed    = document.getElementById('pl-speed');
const volIcon    = document.getElementById('vol-icon');

// ================================================================
//  ICONS (Feather — feathericons.com, MIT licensed)
//  Inner markup copied verbatim from the official Feather .svg files.
// ================================================================
const ICONS = {
  search:      '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>',
  play:        '<polygon points="5 3 19 12 5 21 5 3"></polygon>',
  pause:       '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>',
  skipBack:    '<polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line>',
  skipForward: '<polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line>',
  rotateCcw:   '<polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>',
  rotateCw:    '<polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>',
  vol2:        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>',
  vol1:        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>',
  volX:        '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>',
  x:           '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  trash:       '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
  chevronLeft: '<polyline points="15 18 9 12 15 6"></polyline>',
  plus:        '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  check:       '<polyline points="20 6 9 17 4 12"></polyline>',
  mic:         '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>',
};
// Returns an inline Feather SVG (stroked, inherits currentColor for theming).
function fi(name, size = 22) {
  return `<svg class="fi" viewBox="0 0 24 24" width="${size}" height="${size}" `
    + `fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" `
    + `stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

// ================================================================
//  PERSISTENCE (localStorage)
// ================================================================
const LS_LIBRARY  = 'podterm.library.v1';
const LS_SETTINGS = 'podterm.settings.v1';

function saveLibrary() {
  try { localStorage.setItem(LS_LIBRARY, JSON.stringify(library)); } catch (e) {}
}
function loadLibrary() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_LIBRARY) || '[]');
    if (Array.isArray(arr)) {
      // Keep only well-formed entries (guards against older/corrupt data)
      library = arr.filter(p => p && p.id && p.feedUrl && p.name);
    }
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(LS_SETTINGS, JSON.stringify({ vol, muted, speedIdx })); } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}');
    if (typeof s.vol === 'number') vol = Math.max(0, Math.min(1, s.vol));
    if (typeof s.muted === 'boolean') muted = s.muted;
    if (Number.isInteger(s.speedIdx) && s.speedIdx >= 0 && s.speedIdx < SPEEDS.length) speedIdx = s.speedIdx;
  } catch (e) {}
}

// Resume points: per-episode playback position + the last-played episode
const LS_POSITIONS  = 'podterm.positions.v1';   // { epKey: seconds }
const LS_LASTPLAYED = 'podterm.lastplayed.v1';  // { podId, idx, key, title, podName, artwork, audioUrl, position }
let positions  = {};
let lastPlayed = null;
let curKey     = null;   // resume-key of the episode currently in the player

function epKey(podId, ep) { return podId + '::' + ((ep && (ep.guid || ep.audioUrl)) || ''); }

function loadPositions() {
  try { const p = JSON.parse(localStorage.getItem(LS_POSITIONS) || '{}'); if (p && typeof p === 'object') positions = p; } catch (e) {}
  try { const lp = JSON.parse(localStorage.getItem(LS_LASTPLAYED) || 'null'); if (lp && lp.audioUrl) lastPlayed = lp; } catch (e) {}
}
// Remember where we are in the current episode (called on pause / background / periodically)
function savePosition() {
  if (!curKey) return;
  const t = aud.currentTime;
  if (!isFinite(t) || t <= 0) return;
  positions[curKey] = t;
  try { localStorage.setItem(LS_POSITIONS, JSON.stringify(positions)); } catch (e) {}
  if (lastPlayed) {
    lastPlayed.position = t;
    try { localStorage.setItem(LS_LASTPLAYED, JSON.stringify(lastPlayed)); } catch (e) {}
  }
}
function clearPosition() {
  if (!curKey) return;
  delete positions[curKey];
  try { localStorage.setItem(LS_POSITIONS, JSON.stringify(positions)); } catch (e) {}
}

// ================================================================
//  UTILS
// ================================================================
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(s) {
  if (!s || isNaN(s) || s < 0) return '0:00';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = Math.floor(s % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
  return `${m}:${String(sc).padStart(2,'0')}`;
}

function fmtDur(str) {
  if (!str) return '';
  const p = str.split(':');
  if (p.length === 3) { const h = +p[0]; const m = +p[1]; return h > 0 ? `${h}h ${m}m` : `${m}m`; }
  if (p.length === 2) return `${+p[0]}m`;
  const s = parseInt(str, 10);
  if (!isNaN(s)) { const h = Math.floor(s/3600); const m = Math.floor((s%3600)/60); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
  return str;
}

function fmtDate(s) {
  if (!s) return '';
  try { return new Date(s).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }); }
  catch { return ''; }
}

function xmlTag(el, ...names) {
  for (const n of names) {
    // Try with prefix first, then local name only
    let nodes = el.getElementsByTagName(n);
    if (nodes.length) return (nodes[0].textContent || '').trim();
    // Strip namespace prefix and retry
    const local = n.includes(':') ? n.split(':')[1] : n;
    nodes = el.getElementsByTagName(local);
    if (nodes.length) return (nodes[0].textContent || '').trim();
  }
  return '';
}

function xmlAttr(el, tag, attr) {
  let nodes = el.getElementsByTagName(tag);
  if (!nodes.length) nodes = el.getElementsByTagName(tag.split(':').pop());
  return nodes.length ? (nodes[0].getAttribute(attr) || '') : '';
}

// ================================================================
//  RSS FETCH (multi-strategy with CORS proxy fallbacks)
// ================================================================
async function fetchWithTimeout(url, ms = 14000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(id); }
}

function parseXml(text) {
  if (!text) throw new Error('Empty response');
  const parser = new DOMParser();
  let xml = parser.parseFromString(text, 'text/xml');
  if (xml.querySelector('parsererror')) {
    xml = parser.parseFromString(text, 'text/html');
    if (!xml.querySelector('item, entry')) throw new Error('Invalid RSS/XML');
  }
  return xml;
}

async function fetchEpisodes(feedUrl) {
  const strategies = [
    // 0 – direct fetch (works when podcast CDN sets CORS headers)
    async () => {
      const r = await fetchWithTimeout(feedUrl);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return parseEpisodes(parseXml(await r.text()));
    },
    // 1 – allorigins /raw  (raw content, no JSON wrapper – often avoids 413)
    async () => {
      const r = await fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`);
      if (!r.ok) throw new Error(`allorigins/raw HTTP ${r.status}`);
      return parseEpisodes(parseXml(await r.text()));
    },
    // 2 – corsproxy.io
    async () => {
      const r = await fetchWithTimeout(`https://corsproxy.io/?${encodeURIComponent(feedUrl)}`);
      if (!r.ok) throw new Error(`corsproxy HTTP ${r.status}`);
      return parseEpisodes(parseXml(await r.text()));
    },
    // 3 – allorigins /get  (JSON wrapper, smaller payload cap but worth trying)
    async () => {
      const r = await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
      if (!r.ok) throw new Error(`allorigins/get HTTP ${r.status}`);
      const j = await r.json();
      return parseEpisodes(parseXml(j.contents || ''));
    },
    // 4 – codetabs proxy
    async () => {
      const r = await fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl)}`);
      if (!r.ok) throw new Error(`codetabs HTTP ${r.status}`);
      return parseEpisodes(parseXml(await r.text()));
    },
  ];

  let lastErr;
  for (const strategy of strategies) {
    try {
      const eps = await strategy();
      if (eps.length > 0) return eps;
      lastErr = new Error('Feed parsed but no audio episodes found');
    } catch (e) {
      lastErr = e;
      // 413 = payload too large for this proxy, skip immediately to next
    }
  }
  throw lastErr || new Error('All fetch strategies failed');
}

function parseEpisodes(xml) {
  const items = xml.querySelectorAll('item, entry');
  const eps = [];
  items.forEach((item, i) => {
    const title = xmlTag(item, 'title');
    // Find audio URL: enclosure url attr, or media:content url, or link
    let audioUrl = xmlAttr(item, 'enclosure', 'url')
                || xmlAttr(item, 'media:content', 'url')
                || xmlAttr(item, 'media:group > media:content', 'url')
                || '';
    // Try enclosure without namespace
    if (!audioUrl) {
      const enc = item.querySelector('enclosure') || item.getElementsByTagName('enclosure')[0];
      if (enc) audioUrl = enc.getAttribute('url') || '';
    }
    if (!audioUrl) return; // skip non-audio items
    const duration = xmlTag(item, 'itunes:duration', 'duration');
    const pubDate  = xmlTag(item, 'pubDate', 'published', 'updated');
    const guid     = xmlTag(item, 'guid', 'id') || `ep-${i}`;
    eps.push({ title, audioUrl, duration, pubDate, guid });
  });
  // Keep only the latest few episodes (feeds are newest-first)
  return eps.slice(0, EPISODE_LIMIT);
}

// ================================================================
//  SEARCH
// ================================================================
function positionOverlay() {
  const rect = document.querySelector('.hdr-search').getBoundingClientRect();
  sOverlay.style.left  = rect.left + 'px';
  sOverlay.style.width = Math.max(460, rect.width) + 'px';
}

const SEARCH_ICON = fi('search', 20);

async function doSearch() {
  const q = searchInp.value.trim();
  if (!q) return;
  searchBtn.disabled = true;
  searchBtn.innerHTML = '<span class="spin"></span>';
  sOverlay.innerHTML = '';
  sOverlay.classList.add('open');
  positionOverlay();
  try {
    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=podcast&limit=8&entity=podcast`);
    const data = await res.json();
    renderSR(data.results || []);
  } catch {
    sOverlay.innerHTML = '<div class="sr-no-results">Network error — check your connection</div>';
    addSRFooter(0);
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerHTML = SEARCH_ICON;
  }
}

function renderSR(results) {
  if (!results.length) {
    sOverlay.innerHTML = '<div class="sr-no-results">No results for that query</div>';
    addSRFooter(0);
    return;
  }
  const addedIds = new Set(library.map(p => p.id));
  sOverlay.innerHTML = results.map(r => {
    const id = String(r.collectionId);
    const added  = addedIds.has(id);
    const noFeed = !r.feedUrl;
    const name = r.collectionName || '';
    const label = added ? 'Added' : noFeed ? 'No feed available' : `Add ${name} to library`;
    const inner = added ? `${fi('check', 14)}Added` : noFeed ? 'No feed' : `${fi('plus', 14)}Add`;
    return `<div class="sr-item">
      ${r.artworkUrl60 ? `<img class="sr-art" src="${esc(r.artworkUrl60)}" alt="" />` : `<div class="sr-ph">${fi('mic', 16)}</div>`}
      <div class="sr-info">
        <div class="sr-name">${esc(name)}</div>
        <div class="sr-author">${esc(r.artistName || '')}</div>
      </div>
      <button class="sr-add${added ? ' added' : ''}" type="button" aria-label="${esc(label)}"
        data-id="${id}"
        data-name="${esc(name)}"
        data-author="${esc(r.artistName || '')}"
        data-feed="${esc(r.feedUrl || '')}"
        data-art="${esc(r.artworkUrl100 || r.artworkUrl60 || '')}"
        data-cat="${esc(r.primaryGenreName || '')}"
        ${added || noFeed ? 'disabled' : ''}
      >${inner}</button>
    </div>`;
  }).join('');
  addSRFooter(results.length);

  sOverlay.querySelectorAll('.sr-add:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (library.find(p => p.id === id)) return;
      library.push({ id, name: btn.dataset.name, author: btn.dataset.author, feedUrl: btn.dataset.feed, artwork: btn.dataset.art || null, category: btn.dataset.cat || '' });
      saveLibrary();
      toast(`Added ${btn.dataset.name}`);
      renderLibrary();
      closeSR();          // collapse the search results after adding
      searchInp.value = '';
    });
  });
}

function addSRFooter(count) {
  const div = document.createElement('div');
  div.className = 'sr-footer';
  div.innerHTML = `<span class="sr-footer-meta">${count} result${count !== 1 ? 's' : ''} from iTunes</span><button class="sr-close" type="button" aria-label="Close search results">Close</button>`;
  div.querySelector('.sr-close').addEventListener('click', closeSR);
  sOverlay.appendChild(div);
}

function closeSR() {
  sOverlay.classList.remove('open');
  sOverlay.innerHTML = '';
}

document.addEventListener('click', e => {
  if (!sOverlay.contains(e.target) && !document.querySelector('.hdr-search').contains(e.target)) closeSR();
});

searchBtn.addEventListener('click', doSearch);
searchInp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ================================================================
//  LIBRARY
// ================================================================
function renderLibrary() {
  if (!library.length) {
    podList.classList.remove('grid');
    podList.innerHTML = '';
    return;
  }
  podList.classList.add('grid');
  podList.innerHTML = library.map(p => {
    const isActive = p.id === selId;
    return `<div class="p-item${isActive ? ' active' : ''}">
      <button class="p-open" type="button" data-id="${p.id}"
        aria-label="Open ${esc(p.name)}"${isActive ? ' aria-current="true"' : ''}>
        <span class="p-cover">${p.artwork ? `<img class="p-thumb" src="${esc(p.artwork)}" alt="" />` : `<span class="p-ph">${fi('mic', 22)}</span>`}</span>
        <span class="p-name">${esc(p.name)}</span>
      </button>
    </div>`;
  }).join('');

  podList.querySelectorAll('.p-open').forEach(btn => {
    btn.addEventListener('click', () => selectPod(btn.dataset.id));
  });
}

function removePod(id) {
  library = library.filter(p => p.id !== id);
  saveLibrary();
  delete epCache[id];
  if (selId === id) { selId = null; showEmpty(); }
  renderLibrary();
  toast('Removed from your library');
}

// ================================================================
//  SELECT PODCAST & LOAD EPISODES
// ================================================================
const BACK_BTN = `<button class="c-back" type="button" aria-label="Back to library">${fi('chevronLeft', 20)}</button>`;
const C_ART_PH = `<div class="c-art-ph">${fi('mic', 20)}</div>`;
const cDel = pod => `<button class="c-del" type="button" data-del="${pod.id}" aria-label="Delete ${esc(pod.name)} from library">${fi('trash', 16)}<span>Delete</span></button>`;

async function selectPod(id) {
  selId = id;
  document.querySelector('.app').classList.add('view-eps'); // mobile: show episodes
  renderLibrary();
  const pod = library.find(p => p.id === id);
  if (!pod) return;

  if (epCache[id]) { renderEps(pod, epCache[id]); return; }

  // Loading state
  contentEl.innerHTML = `
    <div class="c-head">
      ${BACK_BTN}
      ${pod.artwork ? `<img class="c-art" src="${esc(pod.artwork)}" alt="" />` : C_ART_PH}
      <div class="c-meta">
        <div class="c-title">${esc(pod.name)}</div>
        <div class="c-author">${esc(pod.author)}</div>
        <div class="c-count">Fetching feed…</div>
      </div>
      ${cDel(pod)}
    </div>
    <div class="loading-row" id="load-msg"><span class="spin"></span>&nbsp;Loading episodes…</div>`;

  try {
    const eps = await fetchEpisodes(pod.feedUrl);
    epCache[id] = eps;
    renderLibrary();
    if (selId === id) renderEps(pod, eps);
  } catch (err) {
    if (selId === id) {
      const el = document.getElementById('load-msg');
      if (el) el.outerHTML = `<div class="err-row">Couldn't load this feed<br>${esc(err.message)}<br><br>The feed may block cross-origin requests.<br>Try adding the feed URL manually.</div>`;
    }
  }
}

function renderEps(pod, eps) {
  if (!eps.length) {
    contentEl.innerHTML = `
      <div class="c-head">
        ${BACK_BTN}
        ${pod.artwork ? `<img class="c-art" src="${esc(pod.artwork)}" alt="" />` : C_ART_PH}
        <div class="c-meta"><div class="c-title">${esc(pod.name)}</div><div class="c-author">${esc(pod.author)}</div><div class="c-count">No playable episodes found</div></div>
        ${cDel(pod)}
      </div>
      <div class="err-row">No audio episodes found in this feed</div>`;
    return;
  }
  contentEl.innerHTML = `
    <div class="c-head">
      ${BACK_BTN}
      ${pod.artwork ? `<img class="c-art" src="${esc(pod.artwork)}" alt="" />` : C_ART_PH}
      <div class="c-meta">
        <div class="c-title">${esc(pod.name)}</div>
        <div class="c-author">${esc(pod.author)}</div>
        <div class="c-count">${eps.length} episode${eps.length !== 1 ? 's' : ''}</div>
      </div>
      ${cDel(pod)}
    </div>
    <div class="ep-list" role="list">
      ${eps.map((ep, i) => {
        const active = playId === pod.id && playIdx === i;
        const isPlaying = active && !aud.paused;
        const act = isPlaying ? 'Pause' : 'Play';
        const dur = ep.duration ? fmtDur(ep.duration) : '';
        const date = ep.pubDate ? fmtDate(ep.pubDate) : '';
        const meta = [dur, date].filter(Boolean).join(', ');
        return `<button class="ep-item${active ? ' playing' : ''}" type="button" role="listitem"
          data-id="${pod.id}" data-i="${i}" aria-label="${act} episode: ${esc(ep.title)}${meta ? '. ' + esc(meta) : ''}">
          <span class="ep-info">
            <span class="ep-title">${esc(ep.title)}</span>
            <span class="ep-meta">${dur ? `<span>${dur}</span>` : ''}${dur && date ? '<span class="ep-sep">|</span>' : ''}${date ? `<span class="ep-date">${date}</span>` : ''}</span>
          </span>
          <span class="ep-ico" aria-hidden="true">${fi(isPlaying ? 'pause' : 'play', 18)}</span>
        </button>`;
      }).join('')}
    </div>`;

  contentEl.querySelectorAll('.ep-item').forEach(el => {
    el.addEventListener('click', () => playEp(el.dataset.id, +el.dataset.i));
  });
}

function showEmpty() {
  contentEl.innerHTML = `
    <div class="c-empty">
      <div class="c-empty-icon">${fi('mic', 26)}</div>
      <div class="c-msg">
        <p class="c-msg-title">No podcast selected</p>
        <p class="c-msg-body">Choose one from your library, or search to add a new show.</p>
      </div>
    </div>`;
}

// ================================================================
//  PLAYBACK
// ================================================================
function playEp(podId, idx) {
  const pod = library.find(p => p.id === podId);
  const eps = epCache[podId];
  if (!pod || !eps || !eps[idx]) return;
  const ep = eps[idx];

  const wasPlayingThis = playId === podId && playIdx === idx;
  if (wasPlayingThis) { aud.paused ? aud.play() : aud.pause(); return; }

  playId  = podId;
  playIdx = idx;
  curKey  = epKey(podId, ep);
  aud.src = ep.audioUrl;
  aud.playbackRate = SPEEDS[speedIdx];
  aud.volume = muted ? 0 : vol;

  // Resume from the saved position for this episode, if any
  const resumeAt = positions[curKey] || 0;
  if (resumeAt > 0) {
    aud.addEventListener('loadedmetadata', () => {
      if (resumeAt < aud.duration - 2) aud.currentTime = resumeAt;
    }, { once: true });
  }
  aud.play().catch(() => {});

  // Remember this as the last-played episode (to restore on next launch)
  lastPlayed = { podId, idx, key: curKey, title: ep.title, podName: pod.name, artwork: pod.artwork || null, audioUrl: ep.audioUrl, position: resumeAt };
  try { localStorage.setItem(LS_LASTPLAYED, JSON.stringify(lastPlayed)); } catch (e) {}

  // Update player bar
  plTitle.className = 'pl-ep';
  plTitle.textContent = ep.title;
  plPod.textContent = pod.name;

  const newArt = pod.artwork
    ? `<img class="pl-art" id="pl-art" src="${esc(pod.artwork)}" alt="" />`
    : `<div class="pl-ph" id="pl-art" aria-hidden="true" hidden></div>`;
  document.getElementById('pl-art').outerHTML = newArt;

  btnPlay.disabled = false;
  btnBack.disabled = false;
  btnFwd.disabled  = false;
  updateNav();

  // Re-render episode list if this podcast is showing
  if (selId === podId) renderEps(pod, eps);
}

function updateNav() {
  const eps = epCache[playId];
  btnPrev.disabled = !eps || playIdx <= 0;
  btnNext.disabled = !eps || playIdx >= eps.length - 1;
}

// Reflect play/pause state on the button (icon + accessible name)
function setPlayIcon(playing) {
  btnPlay.innerHTML = fi(playing ? 'pause' : 'play', 22);
  btnPlay.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

// On launch, put the last-played episode back in the player (paused, at its
// saved position) so the user can just hit play to continue.
function restoreLastPlayed() {
  if (!lastPlayed || !lastPlayed.audioUrl) return;
  if (!library.some(p => p.id === lastPlayed.podId)) { lastPlayed = null; return; } // feed was removed
  playId  = lastPlayed.podId;
  playIdx = lastPlayed.idx;
  curKey  = lastPlayed.key;
  aud.src = lastPlayed.audioUrl;
  aud.playbackRate = SPEEDS[speedIdx];
  aud.volume = muted ? 0 : vol;

  const resumeAt = positions[curKey] || lastPlayed.position || 0;
  if (resumeAt > 0) {
    aud.addEventListener('loadedmetadata', () => {
      if (resumeAt < aud.duration - 2) aud.currentTime = resumeAt;
    }, { once: true });
  }

  plTitle.className = 'pl-ep';
  plTitle.textContent = lastPlayed.title;
  plPod.textContent = lastPlayed.podName;
  const newArt = lastPlayed.artwork
    ? `<img class="pl-art" id="pl-art" src="${esc(lastPlayed.artwork)}" alt="" />`
    : `<div class="pl-ph" id="pl-art" aria-hidden="true" hidden></div>`;
  document.getElementById('pl-art').outerHTML = newArt;

  btnPlay.disabled = false;
  btnBack.disabled = false;
  btnFwd.disabled  = false;
  setPlayIcon(false);
  updateNav();  // prev/next stay disabled until the feed is opened
}

// Audio events
let lastSaved = 0;
aud.addEventListener('timeupdate', () => {
  const c = aud.currentTime, d = aud.duration || 0;
  plCur.textContent = fmtTime(c);
  plDur.textContent = fmtTime(d);
  const pct = d ? (c / d) * 100 : 0;
  progFill.style.width = pct + '%';
  progTrack.setAttribute('aria-valuenow', Math.round(pct));
  progTrack.setAttribute('aria-valuetext', `${fmtTime(c)} of ${fmtTime(d)}`);
  // Persist the resume point every ~5s of playback
  if (!aud.paused && Math.abs(c - lastSaved) >= 5) { lastSaved = c; savePosition(); }
});

aud.addEventListener('play',  () => { setPlayIcon(true);  refreshEpList(); });
aud.addEventListener('pause', () => { setPlayIcon(false); savePosition(); refreshEpList(); });
aud.addEventListener('ended', () => {
  clearPosition();   // finished — forget the resume point
  const eps = epCache[playId];
  if (eps && playIdx < eps.length - 1) playEp(playId, playIdx + 1);
  else { setPlayIcon(false); refreshEpList(); }
});
aud.addEventListener('error', () => toast("Couldn't load this episode"));

// Save the resume point when the app is backgrounded or closed (covers iOS swipe-away)
document.addEventListener('visibilitychange', () => { if (document.hidden) savePosition(); });
window.addEventListener('pagehide', savePosition);

function refreshEpList() {
  if (selId && epCache[selId]) {
    const pod = library.find(p => p.id === selId);
    if (pod) renderEps(pod, epCache[selId]);
  }
}

// ================================================================
//  PLAYER CONTROLS
// ================================================================
btnPlay.addEventListener('click', () => { aud.paused ? aud.play() : aud.pause(); });
btnBack.addEventListener('click', () => { aud.currentTime = Math.max(0, aud.currentTime - 15); });
btnFwd.addEventListener('click',  () => { aud.currentTime = Math.min(aud.duration || 0, aud.currentTime + 15); });
btnPrev.addEventListener('click', () => { if (playIdx > 0) playEp(playId, playIdx - 1); });
btnNext.addEventListener('click', () => { const eps = epCache[playId]; if (eps && playIdx < eps.length - 1) playEp(playId, playIdx + 1); });

// Seek (pointer + touch + keyboard — the track is role="slider")
let seeking = false;
function seekClientX(cx) {
  if (!aud.duration) return;
  const rect = progTrack.getBoundingClientRect();
  const r = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
  aud.currentTime = r * aud.duration;
}
progTrack.addEventListener('mousedown', e => { seeking = true; seekClientX(e.clientX); });
document.addEventListener('mousemove',  e => { if (seeking) seekClientX(e.clientX); });
document.addEventListener('mouseup',    () => { seeking = false; });

// Touch: only seek on a tap or a clearly HORIZONTAL drag. A vertical swipe
// (e.g. the iOS swipe-up-to-home gesture) is ignored so it never moves the playhead.
let touch = null;
progTrack.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touch = { x: t.clientX, y: t.clientY, seeking: false };
}, { passive: true });
progTrack.addEventListener('touchmove', e => {
  if (!touch) return;
  const t = e.touches[0];
  if (!touch.seeking) {
    const dx = Math.abs(t.clientX - touch.x), dy = Math.abs(t.clientY - touch.y);
    if (dy > dx && dy > 8) { touch = null; return; }   // vertical intent → let the gesture pass
    if (dx > 8) touch.seeking = true;                  // horizontal intent → start seeking
  }
  if (touch.seeking) seekClientX(t.clientX);
}, { passive: true });
progTrack.addEventListener('touchend', () => {
  if (touch && !touch.seeking) seekClientX(touch.x);   // barely moved → treat as a tap
  touch = null;
});
progTrack.addEventListener('keydown', e => {
  if (!aud.duration) return;
  let handled = true;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowUp':   aud.currentTime = Math.min(aud.duration, aud.currentTime + 5); break;
    case 'ArrowLeft':  case 'ArrowDown': aud.currentTime = Math.max(0, aud.currentTime - 5); break;
    case 'PageUp':   aud.currentTime = Math.min(aud.duration, aud.currentTime + 30); break;
    case 'PageDown': aud.currentTime = Math.max(0, aud.currentTime - 30); break;
    case 'Home': aud.currentTime = 0; break;
    case 'End':  aud.currentTime = aud.duration; break;
    default: handled = false;
  }
  if (handled) e.preventDefault();
});

// Volume
function renderVolUI() {
  const shown = muted ? 0 : vol;
  volFill.style.width = (shown * 100) + '%';
  volIcon.innerHTML = fi(muted || vol === 0 ? 'volX' : vol < 0.5 ? 'vol1' : 'vol2', 20);
  volIcon.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  volTrack.setAttribute('aria-valuenow', Math.round(vol * 100));
  volTrack.setAttribute('aria-valuetext', muted ? 'Muted' : Math.round(vol * 100) + ' percent');
}
function volSetTo(v) {
  vol = Math.max(0, Math.min(1, v));
  muted = vol === 0;
  aud.volume = vol;
  renderVolUI();
}
function setVolFromPointer(e) {
  const rect = volTrack.getBoundingClientRect();
  volSetTo((e.clientX - rect.left) / rect.width);
}
let volDrag = false;
volTrack.addEventListener('mousedown', e => { volDrag = true; setVolFromPointer(e); });
document.addEventListener('mousemove',  e => { if (volDrag) setVolFromPointer(e); });
document.addEventListener('mouseup',    () => { if (volDrag) saveSettings(); volDrag = false; });
volTrack.addEventListener('keydown', e => {
  let handled = true;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowUp':   volSetTo(vol + 0.05); break;
    case 'ArrowLeft':  case 'ArrowDown': volSetTo(vol - 0.05); break;
    case 'Home': volSetTo(0); break;
    case 'End':  volSetTo(1); break;
    default: handled = false;
  }
  if (handled) { e.preventDefault(); saveSettings(); }
});
volIcon.addEventListener('click', () => {
  muted = !muted;
  aud.volume = muted ? 0 : vol;
  renderVolUI();
  saveSettings();
});

// Speed
function renderSpeedUI() {
  const s = SPEEDS[speedIdx];
  const label = (Number.isInteger(s) ? s.toFixed(1) : String(s)) + 'x';
  plSpeed.textContent = label;
  plSpeed.setAttribute('aria-label', `Playback speed ${label}. Activate to change.`);
}
plSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  aud.playbackRate = SPEEDS[speedIdx];
  renderSpeedUI();
  saveSettings();
});

// Episode-header actions (delegated — c-head is re-rendered)
contentEl.addEventListener('click', e => {
  if (e.target.closest('.c-back')) {
    document.querySelector('.app').classList.remove('view-eps');   // mobile: back to library
  } else {
    const del = e.target.closest('.c-del');
    if (del) {
      document.querySelector('.app').classList.remove('view-eps'); // return to library grid
      removePod(del.dataset.del);
    }
  }
});

// ================================================================
//  INIT
// ================================================================
loadSettings();
loadLibrary();
loadPositions();

// Static control-button icons (Feather)
btnPrev.innerHTML = fi('skipBack', 20);
btnNext.innerHTML = fi('skipForward', 20);
btnBack.innerHTML = fi('rotateCcw', 19) + '<span class="skip-num">15</span>';
btnFwd.innerHTML  = fi('rotateCw', 19) + '<span class="skip-num">15</span>';
setPlayIcon(false);

// Apply restored audio settings
aud.volume = muted ? 0 : vol;
aud.playbackRate = SPEEDS[speedIdx];
renderVolUI();
renderSpeedUI();

showEmpty();
renderLibrary();
restoreLastPlayed();  // put the last-played episode back in the player, paused

// Register service worker (enables offline launch + Add-to-Home-Screen app shell).
// Only over http(s) — skipped on file:// so opening the raw file still works.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
